name: Plan PROD

on:
  pull_request:
    branches:
      - main
    paths:
      - "landing-zone/azure/prod/**"
      - "modules/**"

permissions:
  contents: read
  id-token: write

jobs:
  plan-prod:
    runs-on: ubuntu-latest
    environment: prod

    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_my_ip: ${{ vars.TF_VAR_my_ip }}
      ARM_USE_OIDC: true
      TF_VAR_vm_admin_password: ${{ secrets.TF_VAR_vm_admin_password }}

    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.1

      - name: Install Terragrunt
        run: |
          TG_VERSION="0.68.4"
          wget -O terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

### check format

      - name: OpenTofu fmt check
        run: tofu fmt -check -recursive

      - name: Terragrunt hclfmt check
        run: terragrunt hclfmt --check --terragrunt-working-dir .

      - name: Terragrunt validate prod
        working-directory: landing-zone/azure/prod
        run: terragrunt run-all validate --terragrunt-non-interactive

### plan

      - name: Terragrunt plan prod
        id: plan
        working-directory: landing-zone/azure/prod
        continue-on-error: true
        run: |
          terragrunt run-all plan --terragrunt-non-interactive -no-color 2>&1 | tee $GITHUB_WORKSPACE/plan.txt
          exit ${PIPESTATUS[0]}

### comment plan

      - name: Create plan summary
        run: |
          CREATES=$(grep -c "will be created" plan.txt || true)
          UPDATES=$(grep -c "will be updated" plan.txt || true)
          DESTROYS=$(grep -c "will be destroyed" plan.txt || true)
          REPLACED=$(grep -c "must be replaced" plan.txt || true)

          {
            echo "## Terragrunt Plan - Prod"
            echo ""
            echo "| Action | Count |"
            echo "|---|---:|"
            echo "| Create | $CREATES |"
            echo "| Update | $UPDATES |"
            echo "| Destroy | $DESTROYS |"
            echo "| Replace | $REPLACED |"
            echo ""
            echo "<details>"
            echo "<summary>Full plan output</summary>"
            echo ""
            echo '```hcl'
            cat plan.txt
            echo '```'
            echo ""
            echo "</details>"
          } > comment.md

      - name: Comment plan on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terragrunt-plan-prod
          path: comment.md

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
