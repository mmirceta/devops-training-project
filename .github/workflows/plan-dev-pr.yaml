name: Plan Dev PR

on:
  pull_request:
    branches:
      - dev
    paths:
      - "landing-zone/azure/dev/**"
      - "modules/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan-dev:
    runs-on: ubuntu-latest
    environment: dev

    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_my_ip: ${{ vars.TF_VAR_my_ip }}
      
      TF_VAR_vm_admin_password: ${{ secrets.TF_VAR_vm_admin_password }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ vars.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ vars.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ vars.ARM_TENANT_ID }}"
            }

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.1

      - name: Install Terragrunt
        run: |
          TG_VERSION="0.68.4"
          wget -O terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Terragrunt plan dev
        id: plan
        working-directory: landing-zone/azure/dev
        continue-on-error: true
        run: |
          terragrunt run-all plan --terragrunt-non-interactive -no-color 2>&1 | tee $GITHUB_WORKSPACE/plan.txt
          exit ${PIPESTATUS[0]}

      - name: Prepare PR comment
        run: |
          # Strip ANSI escape codes
          sed 's/\x1b\[[0-9;]*m//g' plan.txt > plan_clean.txt

          {
            echo "## Terragrunt Plan - Dev"
            echo ""

            echo "### Resource Changes"
            echo ""

            if grep -qE "STDOUT.*tofu:.*(will be created|will be destroyed|will be updated|must be replaced)" plan_clean.txt; then
              echo "| Module | Action | Resource |"
              echo "|--------|--------|----------|"
              grep -E "STDOUT.*tofu:.*(will be created|will be destroyed|will be updated|must be replaced)" plan_clean.txt | \
              awk '{
                match($0, /\[([^\]]+)\]/, mod); module = mod[1]
                match($0, /tofu: (.*)/, res); full = res[1]
                action = "~ update"
                if (full ~ /will be created/) action = "+ create"
                else if (full ~ /will be destroyed/) action = "- destroy"
                else if (full ~ /must be replaced/) action = "-/+ replace"
                gsub(/ will be.*/, "", full); gsub(/ must be.*/, "", full)
                print "| `" module "` | `" action "` | `" full "` |"
              }'
            else
              echo "> No resource changes detected."
            fi

            echo ""
            echo "### Summary"
            echo ""
            if grep -qE "tofu: Plan:" plan_clean.txt; then
              grep -E "tofu: Plan:" plan_clean.txt | \
              awk '{match($0, /tofu: (.*)/, r); print "- " r[1]}'
            elif grep -q "No changes" plan_clean.txt; then
              echo "> No changes. Infrastructure matches the configuration."
            else
              echo "> Plan output unavailable or plan failed."
            fi

            echo ""
            echo "<details>"
            echo "<summary>Full Plan Output</summary>"
            echo ""
            echo '```'
            cat plan_clean.txt
            echo '```'
            echo "</details>"
          } > comment.md

      - name: Comment plan on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terragrunt-plan-dev
          path: comment.md

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1