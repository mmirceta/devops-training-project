name: Plan Dev PR

on:
  pull_request:
    branches:
      - dev
    paths:
      - "landing-zone/azure/dev/**"
      - "modules/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan-dev:
    runs-on: ubuntu-latest
    environment: dev

    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_my_ip: ${{ vars.TF_VAR_my_ip }}
      
      TF_VAR_vm_admin_password: ${{ secrets.TF_VAR_vm_admin_password }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ vars.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ vars.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ vars.ARM_TENANT_ID }}"
            }

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.1

      - name: Install Terragrunt
        run: |
          TG_VERSION="0.68.4"
          wget -O terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Terragrunt plan dev
        id: plan
        working-directory: landing-zone/azure/dev
        continue-on-error: true
        run: |
          terragrunt run-all plan --terragrunt-non-interactive -no-color 2>&1 | tee $GITHUB_WORKSPACE/plan.txt
          exit ${PIPESTATUS[0]}

      - name: Prepare PR comment
        run: |
          {
            echo "## Terragrunt Plan - Dev"
            echo ""

            echo "### Resource Changes"
            echo ""
            echo '```'
            grep -E "# .*(will be created|will be destroyed|will be updated in-place|must be replaced)" plan.txt \
              | sed 's/  # //' \
              || echo "No resource changes detected."
            echo '```'
            echo ""

            echo "### Summary"
            echo ""
            if grep -q "^Plan:" plan.txt; then
              grep "^Plan:" plan.txt | while IFS= read -r line; do echo "- $line"; done
            elif grep -q "No changes" plan.txt; then
              echo "> No changes. Infrastructure matches the configuration."
            else
              echo "> Plan output unavailable or plan failed."
            fi
            echo ""

            echo "<details>"
            echo "<summary>Full Plan Output</summary>"
            echo ""
            echo '```'
            cat plan.txt
            echo '```'
            echo "</details>"
          } > comment.md

      - name: Comment plan on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terragrunt-plan-dev
          path: comment.md

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1