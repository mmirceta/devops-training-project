name: Promote Image to Latest (Prod)

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name acrbootstraptraining

      - name: Pull dev-latest image
        run: docker pull acrbootstraptraining.azurecr.io/docker-web:dev-latest

      - name: Tag as latest
        run: |
          docker tag \
            acrbootstraptraining.azurecr.io/docker-web:dev-latest \
            acrbootstraptraining.azurecr.io/docker-web:latest

      - name: Push latest
        run: docker push acrbootstraptraining.azurecr.io/docker-web:latest
