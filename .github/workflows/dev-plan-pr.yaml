name: Plan Dev PR

on:
  pull_request:
    branches:
      - dev
    paths:
      - "landing-zone/azure/dev/**"
      - "modules/**"
      - "compose.yaml"
      - "docker-compose.yaml"
      - "**/Dockerfile"
      - "**/.Dockerfile.*"
      - "**/*.dockerfile"



permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  plan-dev:
    runs-on: ubuntu-latest
    environment: dev

    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_my_ip: ${{ vars.TF_VAR_my_ip }}
      ARM_USE_OIDC: true
      
      TF_VAR_vm_admin_password: ${{ secrets.TF_VAR_vm_admin_password }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.1

      - name: Install Terragrunt
        run: |
          TG_VERSION="0.68.4"
          wget -O terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

### check format

      - name: OpenTofu fmt check
        run: tofu fmt -check -recursive

      - name: Terragrunt hclfmt check
        run: terragrunt hclfmt --check --terragrunt-working-dir .

      - name: Terragrunt validate dev
        working-directory: landing-zone/azure/dev
        run: terragrunt run-all validate --terragrunt-non-interactive

### plan

      - name: Terragrunt plan dev
        id: plan
        working-directory: landing-zone/azure/dev
        continue-on-error: true
        run: |
          terragrunt run-all plan --terragrunt-non-interactive -no-color > $GITHUB_WORKSPACE/plan.txt 2>&1

### comment plan

      - name: Create plan summary
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          plan = Path("plan.txt").read_text(errors="ignore")

          groups = {
              "create": [],
              "update": [],
              "replace": [],
              "destroy": [],
          }

          pattern = re.compile(
              r'(# ([^\n]+?) (will be created|will be updated in-place|must be replaced|will be destroyed)\n.*?)(?=\n\s*# |\nPlan:|\Z)',
              re.S
          )

          for block, resource, action in pattern.findall(plan):
              if action == "will be created":
                  groups["create"].append((resource, block))
              elif action == "will be updated in-place":
                  groups["update"].append((resource, block))
              elif action == "must be replaced":
                  groups["replace"].append((resource, block))
              elif action == "will be destroyed":
                  groups["destroy"].append((resource, block))

          def section(title, icon, items):
              out = [f"## {icon} {title} ({len(items)})", ""]
              if not items:
                  out.append("_None_")
                  out.append("")
                  return out

              for resource, block in items:
                  out.append(f"<details>")
                  out.append(f"<summary><code>{resource}</code></summary>")
                  out.append("")
                  out.append("```hcl")
                  out.append(block.strip())
                  out.append("```")
                  out.append("")
                  out.append("</details>")
                  out.append("")
              return out

          comment = []
          comment.append("# Terragrunt Plan - Dev")
          comment.append("")
          comment.append("| Action | Count |")
          comment.append("|---|---:|")
          comment.append(f"| Create | {len(groups['create'])} |")
          comment.append(f"| Update | {len(groups['update'])} |")
          comment.append(f"| Replace | {len(groups['replace'])} |")
          comment.append(f"| Destroy | {len(groups['destroy'])} |")
          comment.append("")

          comment += section("Resources to create", "🟢", groups["create"])
          comment += section("Resources to update", "🟡", groups["update"])
          comment += section("Resources to replace", "🟠", groups["replace"])
          comment += section("Resources to destroy", "🔴", groups["destroy"])

          comment.append("<details>")
          comment.append("<summary>Full raw plan</summary>")
          comment.append("")
          comment.append("```hcl")
          comment.append(plan[-50000:])
          comment.append("```")
          comment.append("")
          comment.append("</details>")

          Path("comment.md").write_text("\n".join(comment))
          PY

      - name: Comment plan on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terragrunt-plan-dev
          path: comment.md

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

####################### DOCKER IMAGE SCAN #######################

  docker-image-scan:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Debug Azure identity and ACR
        run: |
          az account show
          az acr show --name acrdevtraining --query "{loginServer:loginServer, publicNetworkAccess:publicNetworkAccess, networkRuleSet:networkRuleSet.defaultAction}" -o table

      - name: Login to ACR
        run: az acr login --name acrdevtraining

      - name: Build image
        run: |
          docker build \
            --pull \
            --no-cache \
            -f docker/nginx/Dockerfile.nginx \
            -t acrdevtraining.azurecr.io/docker-web:pr-${{ github.event.pull_request.number }}-${{ github.sha }} \
            docker/nginx

      - name: Show built image
        run: docker images acrdevtraining.azurecr.io/docker-web

      - name: Push image to ACR
        run: |
          docker push acrdevtraining.azurecr.io/docker-web:pr-${{ github.event.pull_request.number }}-${{ github.sha }}

      - name: Trivy scan pushed image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            acrdevtraining.azurecr.io/docker-web:pr-${{ github.event.pull_request.number }}-${{ github.sha }}