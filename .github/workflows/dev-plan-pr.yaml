name: Plan Dev PR

on:
  pull_request:
    branches:
      - dev
    paths:
      - "landing-zone/azure/dev/**"
      - "modules/**"
      - "docker/**"



permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  plan-dev:
    runs-on: ubuntu-latest
    environment: dev

    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_my_ip: ${{ vars.TF_VAR_my_ip }}
      ARM_USE_OIDC: true
      
      TF_VAR_vm_admin_password: ${{ secrets.TF_VAR_vm_admin_password }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.1

      - name: Cache OpenTofu providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tofu-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tofu-

      - name: Set provider cache dir
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Install Terragrunt
        run: |
          TG_VERSION="0.68.4"
          wget -O terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

### check format

      - name: OpenTofu fmt check
        run: tofu fmt -check -recursive

      - name: Terragrunt hclfmt check
        run: terragrunt hclfmt --check --terragrunt-working-dir .

      - name: Terragrunt validate dev
        working-directory: landing-zone/azure/dev
        run: terragrunt run-all validate --terragrunt-non-interactive --terragrunt-parallelism 1

### plan

      - name: Terragrunt plan dev
        id: plan
        working-directory: landing-zone/azure/dev
        continue-on-error: true
        run: |
          terragrunt run-all plan --terragrunt-non-interactive --terragrunt-parallelism 1 -no-color > $GITHUB_WORKSPACE/plan.txt 2>&1

### comment plan

      - name: Create plan summary
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          raw = Path("plan.txt").read_text(errors="ignore")

          # Strip ANSI escape codes (Terragrunt colours its own log lines
          # regardless of -no-color, which only affects tofu output)
          clean = re.sub(r'\x1b\[[0-9;]*m', '', raw)

          # Terragrunt wraps every tofu line as:
          #   HH:MM:SS.mmm  STDOUT  [module]  tofu: <actual line>
          # Extract just the tofu content so the parser sees plain plan text
          tofu_re = re.compile(r'^\S+\s+STDOUT\s+\[\S+\]\s+tofu:\s?(.*)', re.MULTILINE)
          plan = '\n'.join(m.group(1) for m in tofu_re.finditer(clean))

          groups = {"create": [], "update": [], "replace": [], "destroy": []}

          ACTION_MAP = {
              "will be created":          "create",
              "will be updated in-place": "update",
              "must be replaced":         "replace",
              "will be destroyed":        "destroy",
          }

          # Pass 1: locate every resource header line
          header_re = re.compile(
              r'^[ \t]*# (\S+) (will be created|will be updated in-place|must be replaced|will be destroyed)$',
              re.MULTILINE,
          )
          matches = list(header_re.finditer(plan))

          # Pass 2: slice the text between consecutive headers to get each diff block
          for i, m in enumerate(matches):
              resource = m.group(1)
              action   = m.group(2)
              start    = m.start()
              end      = matches[i + 1].start() if i + 1 < len(matches) else len(plan)
              chunk    = plan[start:end]
              summary  = re.search(r'\nPlan: \d+', chunk)
              if summary:
                  chunk = chunk[:summary.start()]
              groups[ACTION_MAP[action]].append((resource, chunk.strip()))

          def section(title, items):
              if not items:
                  return []
              out = [f"## {title}", ""]
              for resource, block in items:
                  out.append("<details>")
                  out.append(f"<summary>{resource}</summary>")
                  out.append("")
                  out.append("```hcl")
                  out.append(block)
                  out.append("```")
                  out.append("")
                  out.append("</details>")
                  out.append("")
              return out

          modified = groups["update"] + groups["replace"]

          comment = ["# Terragrunt Plan - Dev", ""]
          comment += section("Create",           groups["create"])
          comment += section("Destroy",          groups["destroy"])
          comment += section("Update / Replace", modified)

          if not groups["create"] and not groups["destroy"] and not modified:
              comment.append("_No changes._")
              comment.append("")

          Path("comment.md").write_text("\n".join(comment))
          PY

      - name: Comment plan on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terragrunt-plan-dev
          path: comment.md

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

####################### DOCKER IMAGE SCAN #######################

  docker-image-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --pull \
            --no-cache \
            -f docker/nginx/Dockerfile.nginx \
            -t docker-web:pr-${{ github.sha }} \
            docker/nginx

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: docker-web:pr-${{ github.sha }}
          format: table
          output: trivy-report.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Format Trivy report
        run: |
          {
            echo "## Trivy Vulnerability Scan"
            echo ""
            echo '```'
            cat trivy-report.txt
            echo '```'
          } > trivy-comment.md

      - name: Post Trivy report as PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: trivy-scan
          path: trivy-comment.md