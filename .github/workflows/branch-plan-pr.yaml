name: Branch-Plan on PR

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "landing-zone/azure/dev/**"
      - "landing-zone/azure/prod/**"
      - "landing-zone/k8s/dev/**"
      - "landing-zone/k8s/prod/**"
      - "modules/**"
      - ".github/workflows/branch-plan-pr.yaml"
      - ".github/workflows/branch-apply-push.yaml"

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  plan:
    runs-on: self-hosted
    environment: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}

    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_my_ip: ${{ vars.TF_VAR_my_ip }}
      TF_VAR_bastion_ssh_public_key: ${{ vars.TF_VAR_bastion_ssh_public_key }}
      ARM_USE_OIDC: true
      TF_VAR_vm_admin_password: ${{ secrets.TF_VAR_vm_admin_password }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.1

      - name: Cache OpenTofu providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tofu-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tofu-

      - name: Set provider cache dir
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Install Terragrunt
        run: |
          TG_VERSION="0.68.4"
          wget -O terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: OpenTofu fmt check
        run: tofu fmt -check -recursive

      - name: Terragrunt hclfmt check
        run: terragrunt hclfmt --check --terragrunt-working-dir .

      - name: Terragrunt validate
        working-directory: landing-zone/azure/${{ github.base_ref == 'main' && 'prod' || 'dev' }}
        run: terragrunt run-all validate --terragrunt-non-interactive --terragrunt-parallelism 1

      - name: Terragrunt validate (k8s)
        working-directory: landing-zone/k8s/${{ github.base_ref == 'main' && 'prod' || 'dev' }}
        run: terragrunt run-all validate --terragrunt-non-interactive --terragrunt-parallelism 1

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov scan
        id: checkov
        continue-on-error: true
        run: |
          checkov \
            -d modules \
            --framework terraform \
            --output cli \
            --compact \
            > checkov-report.txt 2>&1

      - name: Format Checkov comment
        run: |
          python3 <<'PY'
          from pathlib import Path

          outcome = "${{ steps.checkov.outcome }}"
          report = Path("checkov-report.txt").read_text(errors="ignore")

          if len(report) > 50000:
              report = report[:50000] + "\n... (truncated)"

          lines = ["## Checkov IaC Scan", ""]
          if outcome == "failure":
              lines += ["> [!CAUTION]", "> Policy violations found.", ""]
          else:
              lines += ["> [!NOTE]", "> No policy violations found.", ""]

          lines += [
              "<details>",
              "<summary>Full report</summary>",
              "",
              "```",
              report,
              "```",
              "",
              "</details>",
          ]

          Path("checkov-comment.md").write_text("\n".join(lines))
          PY

      - name: Post Checkov report as PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: checkov-scan-${{ github.base_ref == 'main' && 'prod' || 'dev' }}
          path: checkov-comment.md

      - name: Fail if Checkov violations found
        if: steps.checkov.outcome == 'failure'
        run: exit 1

      - name: Terragrunt plan
        id: plan
        working-directory: landing-zone/azure/${{ github.base_ref == 'main' && 'prod' || 'dev' }}
        continue-on-error: true
        run: |
          terragrunt run-all plan --terragrunt-non-interactive --terragrunt-parallelism 1 -no-color > $GITHUB_WORKSPACE/plan.txt 2>&1

      - name: Terragrunt plan (k8s)
        id: plan-k8s
        working-directory: landing-zone/k8s/${{ github.base_ref == 'main' && 'prod' || 'dev' }}
        continue-on-error: true
        run: |
          terragrunt run-all plan --terragrunt-non-interactive --terragrunt-parallelism 1 -no-color > $GITHUB_WORKSPACE/plan-k8s.txt 2>&1

      - name: Create plan summary
        run: |
          python3 <<'PY'
          import re, os
          from pathlib import Path

          base_ref = os.environ.get("GITHUB_BASE_REF", "dev")
          env = "prod" if base_ref == "main" else "dev"
          raw = Path("plan.txt").read_text(errors="ignore")

          clean = re.sub(r'\x1b\[[0-9;]*m', '', raw)

          tofu_re = re.compile(r'^\S+\s+STDOUT\s+\[\S+\]\s+tofu:\s?(.*)', re.MULTILINE)
          plan = '\n'.join(m.group(1) for m in tofu_re.finditer(clean))

          groups = {"create": [], "update": [], "replace": [], "destroy": []}

          ACTION_MAP = {
              "will be created":          "create",
              "will be updated in-place": "update",
              "must be replaced":         "replace",
              "will be destroyed":        "destroy",
          }

          header_re = re.compile(
              r'^[ \t]*# (\S+) (will be created|will be updated in-place|must be replaced|will be destroyed)$',
              re.MULTILINE,
          )
          matches = list(header_re.finditer(plan))

          for i, m in enumerate(matches):
              resource = m.group(1)
              action   = m.group(2)
              start    = m.start()
              end      = matches[i + 1].start() if i + 1 < len(matches) else len(plan)
              chunk    = plan[start:end]
              summary  = re.search(r'\nPlan: \d+', chunk)
              if summary:
                  chunk = chunk[:summary.start()]
              groups[ACTION_MAP[action]].append((resource, chunk.strip()))

          def section(title, items):
              if not items:
                  return []
              out = [f"## {title}", ""]
              for resource, block in items:
                  out.append("<details>")
                  out.append(f"<summary>{resource}</summary>")
                  out.append("")
                  out.append("```hcl")
                  out.append(block)
                  out.append("```")
                  out.append("")
                  out.append("</details>")
                  out.append("")
              return out

          modified = groups["update"] + groups["replace"]

          comment = [f"# Terragrunt Plan - {env.capitalize()}", ""]
          comment += section("Create",           groups["create"])
          comment += section("Destroy",          groups["destroy"])
          comment += section("Update / Replace", modified)

          if not groups["create"] and not groups["destroy"] and not modified:
              comment.append("_No changes._")
              comment.append("")

          Path("comment.md").write_text("\n".join(comment))
          PY

      - name: Comment plan on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terragrunt-plan-${{ github.base_ref == 'main' && 'prod' || 'dev' }}
          path: comment.md

      - name: Create plan summary (k8s)
        run: |
          python3 <<'PY'
          import re, os
          from pathlib import Path

          base_ref = os.environ.get("GITHUB_BASE_REF", "dev")
          env = "prod" if base_ref == "main" else "dev"
          raw = Path("plan-k8s.txt").read_text(errors="ignore")

          clean = re.sub(r'\x1b\[[0-9;]*m', '', raw)

          tofu_re = re.compile(r'^\S+\s+STDOUT\s+\[\S+\]\s+tofu:\s?(.*)', re.MULTILINE)
          plan = '\n'.join(m.group(1) for m in tofu_re.finditer(clean))

          groups = {"create": [], "update": [], "replace": [], "destroy": []}

          ACTION_MAP = {
              "will be created":          "create",
              "will be updated in-place": "update",
              "must be replaced":         "replace",
              "will be destroyed":        "destroy",
          }

          header_re = re.compile(
              r'^[ \t]*# (\S+) (will be created|will be updated in-place|must be replaced|will be destroyed)$',
              re.MULTILINE,
          )
          matches = list(header_re.finditer(plan))

          for i, m in enumerate(matches):
              resource = m.group(1)
              action   = m.group(2)
              start    = m.start()
              end      = matches[i + 1].start() if i + 1 < len(matches) else len(plan)
              chunk    = plan[start:end]
              summary  = re.search(r'\nPlan: \d+', chunk)
              if summary:
                  chunk = chunk[:summary.start()]
              groups[ACTION_MAP[action]].append((resource, chunk.strip()))

          def section(title, items):
              if not items:
                  return []
              out = [f"## {title}", ""]
              for resource, block in items:
                  out.append("<details>")
                  out.append(f"<summary>{resource}</summary>")
                  out.append("")
                  out.append("```hcl")
                  out.append(block)
                  out.append("```")
                  out.append("")
                  out.append("</details>")
                  out.append("")
              return out

          modified = groups["update"] + groups["replace"]

          comment = [f"# Terragrunt Plan - {env.capitalize()} (k8s)", ""]
          comment += section("Create",           groups["create"])
          comment += section("Destroy",          groups["destroy"])
          comment += section("Update / Replace", modified)

          if not groups["create"] and not groups["destroy"] and not modified:
              comment.append("_No changes._")
              comment.append("")

          Path("comment-k8s.md").write_text("\n".join(comment))
          PY

      - name: Comment plan on PR (k8s)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terragrunt-plan-k8s-${{ github.base_ref == 'main' && 'prod' || 'dev' }}
          path: comment-k8s.md

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure' || steps.plan-k8s.outcome == 'failure'
        run: exit 1
