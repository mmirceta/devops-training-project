name: Docker-Image Scan (Dev)

on:
  pull_request:
    branches:
      - dev
    paths:
      - "docker/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  trivy-scan:
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: nginx
            dockerfile: docker/nginx/Dockerfile.nginx
            context: docker/nginx
          - name: apache
            dockerfile: docker/apache/Dockerfile.apache
            context: docker/apache

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: nginx
            dockerfile: docker/nginx/Dockerfile.nginx
            context: docker/nginx
          - name: apache
            dockerfile: docker/apache/Dockerfile.apache
            context: docker/apache

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --pull \
            --no-cache \
            -f ${{ matrix.image.dockerfile }} \
            -t ${{ matrix.image.name }}:pr-${{ github.sha }} \
            ${{ matrix.image.context }}

      - name: Trivy scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 0 \
            ${{ matrix.image.name }}:pr-${{ github.sha }} > trivy-report.txt

      - name: Check CRITICAL vulnerabilities with fix available
        id: critical-check
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            ${{ matrix.image.name }}:pr-${{ github.sha }}

      - name: Format Trivy report
        run: |
          {
            echo "## Trivy Vulnerability Scan — ${{ matrix.image.name }}"
            echo ""
            if [ "${{ steps.critical-check.outcome }}" == "failure" ]; then
              echo "> [!CAUTION]"
              echo "> CRITICAL vulnerabilities with fixes available found. Merge is blocked."
            else
              echo "> [!NOTE]"
              echo "> No CRITICAL vulnerabilities with fixes available."
            fi
            echo ""
            echo "**Image:** \`${{ matrix.image.name }}:pr-${{ github.sha }}\`"
            echo ""
            echo '```'
            cat trivy-report.txt
            echo '```'
          } > trivy-comment.md

      - name: Post Trivy report as PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: trivy-scan-${{ matrix.image.name }}
          path: trivy-comment.md

      - name: Fail if CRITICAL vulnerabilities with fix found
        if: steps.critical-check.outcome == 'failure'
        run: exit 1
