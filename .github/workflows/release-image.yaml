name: Release Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name acrbootstraptraining

      - name: Pull dev-latest image
        run: docker pull acrbootstraptraining.azurecr.io/docker-web:dev-latest

      - name: Tag with version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          docker tag \
            acrbootstraptraining.azurecr.io/docker-web:dev-latest \
            acrbootstraptraining.azurecr.io/docker-web:${VERSION}

      - name: Push versioned tag
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          docker push acrbootstraptraining.azurecr.io/docker-web:${VERSION}
