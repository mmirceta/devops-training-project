name: Release Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name acrbootstraptraining

      - name: Build image
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          docker build \
            -f docker/nginx/Dockerfile.nginx \
            -t acrbootstraptraining.azurecr.io/docker-web:${VERSION} \
            -t acrbootstraptraining.azurecr.io/docker-web:latest \
            docker/nginx

      - name: Push image
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          docker push acrbootstraptraining.azurecr.io/docker-web:${VERSION}
          docker push acrbootstraptraining.azurecr.io/docker-web:latest
