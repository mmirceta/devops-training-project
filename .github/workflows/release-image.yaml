name: Release Image

on:
  push:
    branches:
      - dev
    paths:
      - "docker/VERSION"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < docker/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name acrbootstraptraining

      - name: Build image
        run: |
          docker build \
            -f docker/nginx/Dockerfile.nginx \
            -t acrbootstraptraining.azurecr.io/docker-web:${{ steps.version.outputs.value }} \
            -t acrbootstraptraining.azurecr.io/docker-web:latest \
            docker/nginx

      - name: Push image
        run: |
          docker push acrbootstraptraining.azurecr.io/docker-web:${{ steps.version.outputs.value }}
          docker push acrbootstraptraining.azurecr.io/docker-web:latest
