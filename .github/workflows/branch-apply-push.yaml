name: Branch-Apply on merge

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "landing-zone/azure/dev/**"
      - "landing-zone/azure/prod/**"
      - "landing-zone/k8s/dev/**"
      - "landing-zone/k8s/prod/**"
      - "modules/**"
      - ".github/workflows/branch-plan-pr.yaml"
      - ".github/workflows/branch-apply-push.yaml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terragrunt-apply-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  Plan:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_my_ip: ${{ vars.TF_VAR_my_ip }}
      ARM_USE_OIDC: true
      TF_VAR_vm_admin_password: ${{ secrets.TF_VAR_vm_admin_password }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.1

      - name: Cache OpenTofu providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tofu-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tofu-

      - name: Set provider cache dir
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Install Terragrunt
        run: |
          TG_VERSION="0.68.4"
          wget -O terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Terragrunt plan
        working-directory: landing-zone/azure/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
        run: |
          terragrunt run-all plan \
            --terragrunt-non-interactive \
            --terragrunt-parallelism 1 \
            --terragrunt-out-dir "$GITHUB_WORKSPACE/tfplans"

      - name: Terragrunt plan (k8s)
        working-directory: landing-zone/k8s/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
        run: |
          terragrunt run-all plan \
            --terragrunt-non-interactive \
            --terragrunt-parallelism 1 \
            --terragrunt-out-dir "$GITHUB_WORKSPACE/tfplans-k8s"

      - name: Show generated plans
        run: |
          find "$GITHUB_WORKSPACE/tfplans" -type f -print
          find "$GITHUB_WORKSPACE/tfplans-k8s" -type f -print

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ github.workspace }}/tfplans
          if-no-files-found: error
          retention-days: 7

      - name: Upload plan artifact (k8s)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-k8s-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ github.workspace }}/tfplans-k8s
          if-no-files-found: error
          retention-days: 7

  Review:
    needs: Plan
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod-review' || 'dev-review' }}

    steps:
      - name: Approval completed
        run: echo "Approved"

  Apply:
    needs:
      - Plan
      - Review

    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_my_ip: ${{ vars.TF_VAR_my_ip }}
      ARM_USE_OIDC: true
      TF_VAR_vm_admin_password: ${{ secrets.TF_VAR_vm_admin_password }}

    steps:
      - name: Checkout exact planned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.1

      - name: Restore provider cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tofu-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tofu-

      - name: Set provider cache dir
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Install Terragrunt
        run: |
          TG_VERSION="0.68.4"
          wget -O terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Download exact plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ github.workspace }}/tfplans

      - name: Download exact plan artifact (k8s)
        uses: actions/download-artifact@v4
        with:
          name: tfplan-k8s-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ github.workspace }}/tfplans-k8s

      - name: Verify downloaded plans
        run: |
          echo "Downloaded plan files:"
          find "$GITHUB_WORKSPACE/tfplans" -type f -print
          find "$GITHUB_WORKSPACE/tfplans-k8s" -type f -print

          if ! find "$GITHUB_WORKSPACE/tfplans" -type f | grep -q .; then
            echo "No plan files were downloaded."
            exit 1
          fi

          if ! find "$GITHUB_WORKSPACE/tfplans-k8s" -type f | grep -q .; then
            echo "No k8s plan files were downloaded."
            exit 1
          fi

      - name: Terragrunt apply
        working-directory: landing-zone/azure/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
        run: |
          terragrunt run-all apply \
            --terragrunt-non-interactive \
            --terragrunt-parallelism 1 \
            --terragrunt-out-dir "$GITHUB_WORKSPACE/tfplans"

      - name: Terragrunt apply (k8s)
        working-directory: landing-zone/k8s/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
        run: |
          terragrunt run-all apply \
            --terragrunt-non-interactive \
            --terragrunt-parallelism 1 \
            --terragrunt-out-dir "$GITHUB_WORKSPACE/tfplans-k8s"
