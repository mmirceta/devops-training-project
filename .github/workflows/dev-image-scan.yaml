name: Image Scan (Dev)

on:
  pull_request:
    branches:
      - dev
    paths:
      - "docker/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --pull \
            --no-cache \
            -f docker/nginx/Dockerfile.nginx \
            -t docker-web:pr-${{ github.sha }} \
            docker/nginx

      - name: Trivy scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 0 \
            docker-web:pr-${{ github.sha }} > trivy-report.txt

      - name: Format Trivy report
        run: |
          {
            echo "## Trivy Vulnerability Scan"
            echo ""
            echo "**Image:** \`docker-web:pr-${{ github.sha }}\`"
            echo ""
            echo '```'
            cat trivy-report.txt
            echo '```'
          } > trivy-comment.md

      - name: Post Trivy report as PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: trivy-scan
          path: trivy-comment.md
