name: Destroy Dev Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroy-dev:
    #runs-on: self-hosted
    runs-on: ubuntu-latest
    environment: dev

    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_my_ip: ${{ vars.TF_VAR_my_ip }}
      
      TF_VAR_vm_admin_password: ${{ secrets.TF_VAR_vm_admin_password }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ vars.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ vars.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ vars.ARM_TENANT_ID }}"
            }

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.1

      - name: Install Terragrunt
        run: |
          TG_VERSION="0.68.4"
          wget -O terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Check tools
        run: |
          tofu version
          terragrunt --version
          az version

      - name: Check versions
        run: |
          tofu version
          terragrunt --version
          az account show
      
      - name: Destroy Dev Environment
        working-directory: landing-zone/azure/dev
        run: terragrunt run-all destroy --terragrunt-non-interactive
